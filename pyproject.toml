[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-ruler"
version = "0.1.0"
description = "Semantic rulers: continuous measurement of abstract concepts in embedding space, built on spiritwriter primitives"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [{name = "Aaron Markham"}]
dependencies = [
    "spiritwriter>=0.10.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=8.0"]

[project.scripts]
semantic-ruler = "semantic_ruler.demo:main"

[tool.setuptools.packages.find]
include = ["semantic_ruler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
